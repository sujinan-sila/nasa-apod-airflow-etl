services:
  apod-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: apod
    ports:
      - "5434:5432"   # 5432 = Airflow's own Postgres, 5433 = PostgreSQL 17 installed on Windows
    volumes:
      - apod-db-data:/var/lib/postgresql/data
    networks:
      - airflow

volumes:
  apod-db-data: